version: '3.8'

services:
  task_db:
    container_name: task_db
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=@Paulmburu5
      - POSTGRES_DB=task_management_db
    ports:
      - "5432:5432"
    volumes:
      - task_db_data:/var/lib/postgresql/data

  adminer_panel:
    container_name: adminer_panel
    image: adminer
    ports:
      - "8080:8080"

  task_app:
    container_name: task_app
    image: task_app
    build: .
    ports:
      - "8585:8585"
    volumes:
      - .:/task
    environment:
      - FLASK_DEBUG=1
    command: flask run --host=0.0.0.0 --port=8585

volumes:
  task_db_data: